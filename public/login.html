<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AprenTIC Campus — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <h1>AprenTIC Campus</h1>
      <p>API de gestión académica</p>
    </div>

    <div id="alert" class="alert alert-error hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@aprentic.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
        <span id="btnText">Iniciar sesión</span>
        <span id="btnSpinner" class="spinner hidden"></span>
      </button>
    </form>

    <p class="text-sm text-muted mt-4" style="text-align:center;">
      ¿No tienes cuenta? Habla con un administrador.
    </p>

    <p class="text-sm text-muted mt-2" style="text-align:center; border-top:1px solid var(--border); padding-top:.75rem;">
      <a href="/api-docs" target="_blank" style="color:var(--primary); font-weight:600;">Ver Swagger UI →</a>
    </p>

  </div>

  <script>
    const API = '';  // mismo origen; cambia a URL de Render en producción

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alert.classList.add('hidden');
      btnText.textContent = 'Entrando...';
      btnSpinner.classList.remove('hidden');
      document.getElementById('submitBtn').disabled = true;

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');

        localStorage.setItem('token', data.token);

        // Decodificar payload para guardar rol
        const payload = JSON.parse(atob(data.token.split('.')[1]));
        localStorage.setItem('userRole', payload.rol);
        localStorage.setItem('userId', payload.id);

        window.location.href = 'dashboard.html';
      } catch (err) {
        alert.textContent = err.message;
        alert.classList.remove('hidden');
        btnText.textContent = 'Iniciar sesión';
        btnSpinner.classList.add('hidden');
        document.getElementById('submitBtn').disabled = false;
      }
    });

    // Redirigir si ya hay token
    if (localStorage.getItem('token')) window.location.href = 'dashboard.html';
  </script>

</body>
</html>
